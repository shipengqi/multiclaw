name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    # Only run when a release/v* branch is merged (not just closed)
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')

    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          version: 11
          runtime: node@22
          cache: true

      - name: Build all packages
        run: |
          pnpm --filter @multiclaw/core build
          pnpm --filter @multiclaw/dashboard build
          pnpm --filter multiclaw build

      - name: Get version
        id: pkg
        run: echo "version=$(node -p "require('./packages/cli/package.json').version")" >> $GITHUB_OUTPUT

      - name: Publish to npm
        run: |
          pnpm --filter @multiclaw/core    publish --no-git-checks --access public
          pnpm --filter @multiclaw/dashboard publish --no-git-checks --access public
          pnpm --filter multiclaw          publish --no-git-checks --access public

      - name: Create git tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.pkg.outputs.version }}
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes
