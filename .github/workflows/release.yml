name: Release

# Step 2 of the release flow. Fires when the pull request opened by
# `bump-version.yml` is merged into `main`: builds the packages, publishes them
# to npm, pushes the `v<version>` tag and creates the GitHub Release.
#
# The publish step has to stay in this file. npm trusted publishing (OIDC)
# matches the **workflow filename**, so moving it into `publish.yml` would
# silently break publishing until all three packages are reconfigured on
# npmjs.com. See "Prerequisites" in RELEASING.md.
#
# Full process: RELEASING.md (English) / RELEASING.zh-CN.md (中文).

on:
  # `branches` matches the pull request's *base* branch.
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Publish only when a release pull request was actually merged — closing one
    # without merging must not publish anything. `head.repo` keeps a fork that
    # happens to be named `release/v*` from triggering this.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag and create the GitHub Release
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      # Installs pnpm, the Node version declared in `devEngines` (package.json),
      # and the workspace dependencies.
      - uses: pnpm/setup@v3

      # The three packages are versioned and released together, and the tag
      # below is named after `packages/core` alone. `bump-version.yml` enforces
      # that they agree, but a hand-edited manifest on this branch would publish
      # three different versions under a single tag. Check it again here, on the
      # commit that is actually about to ship.
      - name: Verify the package versions agree
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const dirs = ["packages/core", "packages/cli", "packages/dashboard"];
          const versions = dirs.map((d) => JSON.parse(fs.readFileSync(`${d}/package.json`, "utf8")).version);

          if (new Set(versions).size !== 1) {
            console.log(
              `::error::Packages are out of sync: ${dirs.map((d, i) => `${d}=${versions[i]}`).join(", ")}`,
            );
            process.exit(1);
          }

          console.log(`Publishing v${versions[0]}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `VERSION=${versions[0]}\n`);
          NODE

      - name: Build
        run: pnpm -r build

      # Authentication is npm trusted publishing (OIDC). The job-level
      # `id-token: write` permission lets this step mint a short-lived identity
      # for this repository and workflow file, which the registry matches
      # against the trusted publisher configured on npmjs.com. There is no
      # NPM_TOKEN and no ~/.npmrc — either one would make pnpm take the legacy
      # token path instead of the OIDC exchange.
      #
      # Only `packages/*` is published, so the private `examples/dev-team`
      # package is never considered. `pnpm -r publish` skips versions that are
      # already on the registry, so a re-run after a partial failure finishes
      # the rest instead of failing on the first one.
      - name: Publish to npm
        run: pnpm -r --filter "./packages/*" publish --no-git-checks --access public

      - name: Tag the release
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes
