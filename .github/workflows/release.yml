name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3

      # Changesets publishes straight from the built dist folders.
      - name: Build all packages
        run: pnpm -r build

      # Opens/updates a "Version Packages" PR while changesets are pending;
      # once that PR is merged it publishes the bumped packages to npm and
      # creates the git tag + GitHub release.
      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
