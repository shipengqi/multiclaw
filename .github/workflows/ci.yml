name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format check
        run: pnpm lint

      # Build first: dependent packages resolve cross-package types from the
      # built dist/*.d.ts, so typecheck would fail on a clean checkout otherwise.
      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test & coverage
        # Runs the whole suite and enforces per-package coverage thresholds.
        run: pnpm test:coverage
